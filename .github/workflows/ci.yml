name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR supersedes the run in progress; every run on
# the default branch finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff>=0.6
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - run: pip install -e ".[fast,test]"
      - run: MPLBACKEND=Agg pytest -q --cov=financialkit --cov-report=xml
      - name: Upload coverage to Codecov
        if: always() && (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14')
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
      - run: MPLBACKEND=Agg pytest --doctest-modules financialkit --ignore-glob="*/tests/*" -q

  test-no-numba:
    # numba is optional (the `fast` extra); without it every @njit kernel
    # runs as plain Python via financialkit/_jit.py. This is the install
    # JupyterLite/Pyodide users get.
    name: Test without numba (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - run: python -c "import financialkit.integrators as i; assert not i.HAS_NUMBA"
      # Coverage cannot trace @njit-compiled code, so the kernel bodies in
      # integrators, monte_carlo, pde_methods and options only show as
      # covered here, where they run as plain Python. Codecov merges this
      # report with the numba job's.
      - run: MPLBACKEND=Agg pytest -q --cov=financialkit --cov-report=xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: no-numba
          fail_ci_if_error: false
      - run: MPLBACKEND=Agg pytest --doctest-modules financialkit --ignore-glob="*/tests/*" -q

  package:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: No test modules in the wheel
        run: "! unzip -l dist/*.whl | grep -q '/tests/'"

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy financialkit
