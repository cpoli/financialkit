name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # sphinx-gallery re-executes every examples/*/plot_*.py, so this is the
    # only check that catches a broken gallery example or a bad
    # ".. minigallery::" path in docs/source/history/.
    # Built without numba, the slowest install and the one JupyterLite users
    # get, so the per-example time budget below holds for everyone.
    name: Build Sphinx docs (no numba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The key covers everything an example's output can depend on, so a
      # hit means a passing build already ran this exact gallery and
      # sphinx-gallery skips every example; any change runs them all.
      - name: Restore executed gallery
        id: gallery
        uses: actions/cache@v5
        with:
          path: |
            docs/source/api/gallery
            docs/source/gen_modules
          key: gallery-${{ hashFiles('financialkit/**', 'examples/**', 'docs/source/conf.py', 'pyproject.toml', '.github/workflows/docs.yml') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: python -c "import financialkit.integrators as i; assert not i.HAS_NUMBA"
      # One example at a time, so the timings checked below are not inflated
      # by examples running side by side.
      - run: cd docs && MPLBACKEND=Agg FINANCIALKIT_GALLERY_JOBS=1 make html
      # Every gallery example must run in under 5 s (CLAUDE.md). A cache hit
      # runs no example, and the cached gallery already passed this check.
      - if: steps.gallery.outputs.cache-hit != 'true'
        run: python docs/check_gallery_times.py
